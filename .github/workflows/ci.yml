name: BOS gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Validate BOS graph
        run: python tools/bos_validate.py
      - name: Run countervectors
        run: python -m unittest -q tests.test_bos_validate
